name: CI Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # One job for every architecture and compiler. They all run the same preset;
  # what differs is only what the host provides, which is why the compiler
  # comes from the environment rather than from the project.
  #
  # The cross entries need no sysroot juggling: qemu-user registers binfmt
  # handlers, so ctest executes the foreign test binaries as if they were
  # native. A cross runner also has neither libX11 nor libjpeg, so those
  # entries double as coverage of the build with both optional dependencies
  # absent, and armhf covers a 32-bit target.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            runs-on: ubuntu-latest
            cc: gcc
            packages: libx11-dev libxext-dev libjpeg-dev

          - name: linux-x86_64-clang
            runs-on: ubuntu-latest
            cc: clang
            packages: clang libx11-dev libxext-dev libjpeg-dev

          - name: macos
            runs-on: macos-latest
            cc: clang

          - name: linux-aarch64
            runs-on: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
            qemu: true

          - name: linux-riscv64
            runs-on: ubuntu-latest
            cc: riscv64-linux-gnu-gcc
            packages: gcc-riscv64-linux-gnu
            qemu: true

          - name: linux-armhf
            runs-on: ubuntu-latest
            cc: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf
            qemu: true

          - name: linux-s390x
            runs-on: ubuntu-latest
            cc: s390x-linux-gnu-gcc
            packages: gcc-s390x-linux-gnu
            qemu: true

          - name: linux-sparc64
            runs-on: ubuntu-latest
            cc: sparc64-linux-gnu-gcc
            packages: gcc-sparc64-linux-gnu
            qemu: true

    steps:
    - uses: actions/checkout@v3

    - name: Install packages
      if: matrix.packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    # Registers binfmt handlers so the cross-built test binaries execute as if
    # native. Installing qemu-user-static alone does not do this: the handlers
    # are never registered, and every test fails instantly with an exec error.
    - name: Register qemu binfmt handlers
      if: matrix.qemu
      uses: docker/setup-qemu-action@v3

    - name: Build and test
      env:
        CC: ${{ matrix.cc }}
      run: cmake --workflow --preset default

  # Separate only because it needs choco rather than apt, and a generator that
  # is not the platform default.
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install MinGW-w64
      run: |
        choco install mingw -y
        echo "C:\\tools\\mingw64\\bin" >> $GITHUB_PATH

    - name: Build and test
      env:
        CC: gcc
        CMAKE_GENERATOR: MinGW Makefiles
      run: cmake --workflow --preset default
